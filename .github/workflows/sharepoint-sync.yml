name: SharePoint → website sync

# Pulls documents from the "Pointer Creek Web Content" SharePoint site,
# publishes them under /docs/, and refreshes resources.html, sitemap.xml,
# and llms.txt. Commits any changes, which triggers the Azure deploy.
#
# Turns on automatically once these repo secrets exist:
#   SP_TENANT_ID, SP_CLIENT_ID, SP_CLIENT_SECRET
# (Settings → Secrets and variables → Actions → New repository secret)

on:
  workflow_dispatch: {}        # lets you run it on demand from the Actions tab
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours

permissions:
  contents: write

concurrency:
  group: sharepoint-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Sync from SharePoint
        env:
          SP_TENANT_ID: ${{ secrets.SP_TENANT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
        run: python scripts/sharepoint_sync.py

      - name: Commit changes if any
        run: |
          git config user.name  "pcwm-sharepoint-sync"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Sync documents from SharePoint"
            git push
          else
            echo "No changes."
          fi
